<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="512" height="512" rx="110" fill="url(#grid)" opacity="0.6"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f97316" stroke-width="6" opacity="0.2"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f97316" stroke-width="2" opacity="0.15"/>
  <!-- Oil can body -->
  <rect x="140" y="210" width="180" height="140" rx="20" fill="#f97316"/>
  <!-- Oil can gradient overlay -->
  <rect x="140" y="210" width="180" height="140" rx="20" fill="url(#oilGrad)"/>
  <defs>
    <linearGradient id="oilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Oil can spout -->
  <rect x="260" y="160" width="38" height="72" rx="16" fill="#fb923c"/>
  <rect x="265" y="145" width="28" height="24" rx="8" fill="#fdba74"/>
  <!-- Oil can handle -->
  <path d="M 140 230 Q 100 230 100 256 Q 100 282 140 282" fill="none" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
  <!-- Shine detail -->
  <ellipse cx="190" cy="265" rx="20" ry="32" fill="#fff" opacity="0.12"/>
  <!-- Gear icon top-right -->
  <g transform="translate(380,130)">
    <circle cx="0" cy="0" r="56" fill="#1e293b"/>
    <!-- Gear teeth -->
    <g fill="#f97316">
      <rect x="-8" y="-56" width="16" height="16" rx="3"/>
      <rect x="-8" y="40" width="16" height="16" rx="3"/>
      <rect x="40" y="-8" width="16" height="16" rx="3" transform="rotate(90)"/>
      <rect x="-56" y="-8" width="16" height="16" rx="3" transform="rotate(90)"/>
      <rect x="22" y="-50" width="16" height="16" rx="3" transform="rotate(45,30,-42)"/>
      <rect x="-38" y="-50" width="16" height="16" rx="3" transform="rotate(-45,-30,-42)"/>
      <rect x="22" y="34" width="16" height="16" rx="3" transform="rotate(-45,30,42)"/>
      <rect x="-38" y="34" width="16" height="16" rx="3" transform="rotate(45,-30,42)"/>
    </g>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#f97316" stroke-width="6"/>
    <circle cx="0" cy="0" r="14" fill="#f97316"/>
  </g>
  <!-- App name -->
  <text x="256" y="415" text-anchor="middle" font-family="'Space Grotesk',Arial,sans-serif" font-weight="700" font-size="52" fill="#f97316" letter-spacing="6">OLI</text>
  <text x="256" y="460" text-anchor="middle" font-family="'Space Grotesk',Arial,sans-serif" font-weight="400" font-size="22" fill="#64748b" letter-spacing="3">TRACK</text>
</svg>
